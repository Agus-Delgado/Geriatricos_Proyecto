name = "geriatricos-worker"
main = "src/index.ts"
compatibility_date = "2026-05-28"

# Default environment: local development only (wrangler dev, vitest).
[vars]
# Comma-separated list. Example:
# CORS_ORIGINS = "http://localhost:5173,https://my-frontend.vercel.app"
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
ENVIRONMENT = "development"
# Dev-only value. Replace in real environments.
JWT_SECRET = "dev-only-change-this-secret"
# Dev default token TTL in seconds (8 hours).
JWT_EXPIRES_IN_SECONDS = "28800"

# D1 local/dev binding only.
# Keep this as placeholder. Remote staging uses [env.staging] below.
# Do not use real production or personal data in this environment.
[[d1_databases]]
binding = "DB"
database_name = "geriatricos_d1_dev"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# Remote staging (Bloque 16). Deploy: wrangler deploy --env staging
# JWT_SECRET for staging: wrangler secret put JWT_SECRET --env staging (never in this file).
[env.staging]
name = "geriatricos-worker-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# Local origins for optional UI smoke; add Vercel preview URL only before cutover.
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
JWT_EXPIRES_IN_SECONDS = "28800"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "geriatricos_d1_staging"
database_id = "6a420074-605e-49a6-b00e-95564d8d6eb6"