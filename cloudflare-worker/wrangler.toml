name = "geriatricos-worker"
main = "src/index.ts"
compatibility_date = "2026-05-28"

[vars]
# Comma-separated list. Example:
# CORS_ORIGINS = "http://localhost:5173,https://my-frontend.vercel.app"
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
ENVIRONMENT = "development"

# D1 local/dev binding only.
# Replace database_id only after creating the remote D1 database.
# Do not use real production or personal data in this environment.
[[d1_databases]]
binding = "DB"
database_name = "geriatricos_d1_dev"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"
